name: Deploy CALORIA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verify code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check backend syntax
        working-directory: backend
        run: npm run check

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Check all JavaScript syntax
        run: npm run check

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Pages configuration notice
        if: ${{ vars.API_BASE_URL == '' }}
        run: |
          echo "::warning::API_BASE_URL variable is not set. GitHub Pages build and deploy are skipped until the Render backend URL is added in Settings -> Secrets and variables -> Actions -> Variables."

  build:
    name: Build static site
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ vars.API_BASE_URL != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare GitHub Pages artifact
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          BOT_USERNAME: ${{ vars.BOT_USERNAME }}
        run: node scripts/prepare-pages.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: ${{ vars.API_BASE_URL != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4