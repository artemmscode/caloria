# Render Blueprint for the CALORIA backend, REST API and Telegram bot.
# Docs: https://render.com/docs/blueprint-spec
#
# Secrets are marked `sync: false`: Render asks for them in the dashboard and
# never stores them in the repository. See README.md for where to get each key.

services:
  - type: web
    name: caloria-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCHEDULER_ENABLED
        value: true
      - key: DEFAULT_TIMEZONE
        value: Asia/Omsk

      # Telegram — get the token from @BotFather.
      - key: BOT_TOKEN
        sync: false
      # Random string (openssl rand -hex 32); only A-Z a-z 0-9 _ - are allowed
      # by Telegram for the webhook secret header.
      - key: WEBHOOK_SECRET
        sync: false
      # Public URL of this Render service is detected through RENDER_EXTERNAL_URL;
      # WEBHOOK_URL is optional and only needed for a custom domain.
      # GitHub Pages URL of the Mini App, WITH a trailing slash.
      # Change both URLs if you fork the project under another account.
      - key: MINI_APP_URL
        value: https://artemmscode.github.io/caloria/
      - key: CORS_ORIGINS
        value: https://artemmscode.github.io

      # Session signing key (openssl rand -hex 48).
      - key: JWT_SECRET
        sync: false
      # Protects POST /api/cron/tick (openssl rand -hex 32). Optional, but
      # recommended for keeping reminders alive on the free plan.
      - key: CRON_SECRET
        sync: false

      # Supabase → Project Settings → API Keys.
      - key: SUPABASE_URL
        sync: false
      # Secret key (`sb_secret_...`). Legacy service_role JWTs also work
      # through SUPABASE_SERVICE_ROLE_KEY if the project still uses old keys.
      - key: SUPABASE_SECRET_KEY
        sync: false